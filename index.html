<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тенис на маса във Варна — Спортен комплекс „Варна“ · 14 маси</title>
    <meta name="theme-color" content="#faf9f7" />
    <meta
      name="description"
      content="Спортен комплекс „Варна“: 14 професионални маси за тенис на маса, онлайн резервация на маса, седмични турнири и тренировки за деца и възрастни във Варна."
    />
    <script>
      // Resolve theme and language before first paint so the page never
      // flashes the wrong palette or the wrong `lang`. Storage keys must match
      // THEME_STORAGE_KEY in src/lib/theme.ts and LANGUAGE_STORAGE_KEY in
      // src/i18n/config.ts.
      ;(function () {
        var root = document.documentElement
        var theme = 'light'
        var language = 'bg'
        try {
          var storedTheme = localStorage.getItem('bapha-theme')
          theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var storedLanguage = localStorage.getItem('bapha-language')
          if (storedLanguage === 'bg' || storedLanguage === 'en') {
            language = storedLanguage
          }
        } catch (error) {
          /* storage blocked — fall back to the defaults above */
        }
        root.classList.add(theme)
        root.lang = language
        if (theme === 'dark') {
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#0a0a0a')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
